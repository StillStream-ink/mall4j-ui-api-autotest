name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests (no backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-xdist allure-pytest pycryptodome playwright requests
          python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: |
          pytest testcases/test_unit/ -v