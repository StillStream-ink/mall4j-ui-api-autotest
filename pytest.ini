[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -vs
    --alluredir=reports/allure-results

markers =
    ui: UI 自动化测试
    api: 接口自动化测试
    smoke: 冒烟测试
    regression: 回归测试
    performance: 性能基线测试
    weaknetwork: 弱网测试（仅 Chromium）
    compatibility: 兼容性测试

log_cli = true
log_cli_level = INFO